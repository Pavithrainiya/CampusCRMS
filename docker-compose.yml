# CampusRMS V2.4 Docker Services Stack
services:
  db:
    image: postgres:16
    container_name: campusrms-postgres
    environment:
      POSTGRES_DB: campusrms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - campusrms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusrms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campusrms_pgdata:
